# Continuous integration for HikViewer.
#
#   verify       - every quality gate (`./gradlew ci`): unit tests, ktlint, detekt, Android Lint, Kover.
#   build        - debug + release APKs (release is signed with the debug key here; real signing
#                  happens in release.yml on tags).
#   changes      - decides whether a pull request touched anything the Espresso suites could catch.
#   instrumented - Espresso tests on an Android TV emulator and on a phone emulator. Slow, so they run on pushes
#                  to main, on manual runs, and on pull requests that change app or core code, Gradle files or
#                  these workflows; a docs-only pull request relies on verify + build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Tests, lint, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run quality gates
        run: ./gradlew ci --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: |
            core/build/reports/ktlint/
            core/build/reports/detekt/
            app/build/reports/ktlint/
            app/build/reports/detekt/
            app/build/reports/lint-results-*
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            core/build/reports/kover/
            app/build/reports/kover/
          if-no-files-found: ignore

  build:
    name: Build APKs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Assemble debug and release
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK (universal, no ABI splits)
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK (debug-signed)
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-debug-signed
          path: app/build/outputs/apk/release/app-release.apk

  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'app/**'
              - 'core/**'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/**'

  instrumented:
    name: Espresso on ${{ matrix.name }}
    needs: [verify, changes]
    # Always on main and on demand; on a pull request only when the filter above saw code, build or workflow
    # changes (a dependency bump counts, since those break at runtime more often than in unit tests).
    if: |
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Google ships the API 34 Android TV image for x86 (32-bit) and arm64 only; x86_64 TV images
      # start at API 36. We stay on 34 to match the AVDs described in BUILDING.md. The phone job runs
      # the touch suite (PhoneNavigationTest); the D-pad suites skip themselves there and vice versa.
      matrix:
        include:
          - name: Android TV emulator
            target: android-tv
            arch: x86
            profile: tv_1080p
          - name: phone emulator
            target: google_apis
            arch: x86_64
            profile: pixel_6
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports-${{ matrix.target }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
