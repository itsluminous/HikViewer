# Release build. Triggered by pushing a tag such as `v1.2.3`.
#
# The APKs are signed with the release keystore when the four secrets below are configured
# (see BUILDING.md); otherwise the debug key is used so a fork can still cut test releases.
#   KEYSTORE_BASE64   - `base64 < release.jks`
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Decode release keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run quality gates
        run: ./gradlew ci --stacktrace

      - name: Assemble release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APKs and write checksums
        id: artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out=dist
          mkdir -p "$out"
          for apk in app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk")
            # app-universal-release.apk -> HikViewer-1.2.3-universal.apk
            abi=${name#app-}
            abi=${abi%-release.apk}
            cp "$apk" "$out/HikViewer-$version-$abi.apk"
          done
          (cd "$out" && sha256sum *.apk > "HikViewer-$version-SHA256SUMS.txt")
          ls -l "$out"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$apksigner" verify --print-certs "$apk" | head -2
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: HikViewer ${{ steps.artifacts.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.apk
            dist/*-SHA256SUMS.txt
