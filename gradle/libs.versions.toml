# HikViewer version catalog.
#
# Versions are pinned explicitly; Dependabot (.github/dependabot.yml) proposes bumps.
# Conventions: alphabetical inside each table, one line per entry, comments explain *why*
# a library was chosen when the choice was not obvious.

[versions]
# --- build tooling -----------------------------------------------------------
agp = "8.7.3"                # Android Gradle Plugin; compileSdk 35 needs >= 8.6
kotlin = "2.4.21"            # Kotlin 2.x with K2 compiler
detekt = "1.23.8"
kover = "0.9.11"
ktlintGradle = "14.2.0"      # org.jlleitschuh.gradle.ktlint wrapper around ktlint 1.x

# --- android sdk -------------------------------------------------------------
compileSdk = "35"
targetSdk = "35"
minSdk = "26"

# --- libraries ---------------------------------------------------------------
androidxActivity = "1.9.3"
androidxAppcompat = "1.7.0"
androidxConstraintlayout = "2.2.0"
androidxCore = "1.15.0"
androidxLifecycle = "2.8.7"
androidxRecyclerview = "1.3.2"
androidxSecurityCrypto = "1.1.0-alpha06"
coroutines = "1.11.0"
material = "1.12.0"
okhttp = "4.12.0"
# JSON: kotlinx-serialization was chosen over Moshi because
#   * it is compile-time and reflection-free, so no KSP/kapt round-trip and no ProGuard keep rules
#     for model classes (smaller APK, faster builds; the brief targets 1 GB TVs),
#   * the same @Serializable models work unchanged in the pure-JVM :core module and in :app,
#   * it is maintained by JetBrains alongside the Kotlin version we compile with,
#   * Hik-Connect responses are plain JSON objects; we need no Moshi-only adapters.
serialization = "1.12.0"

# --- test libraries ----------------------------------------------------------
androidxJunit = "1.2.1"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
espresso = "3.6.1"
junit4 = "4.13.2"
junit5 = "5.11.3"
robolectric = "4.14.1"       # Robolectric 4.14 is the first release with SDK 35 support
truth = "1.4.4"
turbine = "1.2.0"

[libraries]
# --- androidx ----------------------------------------------------------------
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidxSecurityCrypto" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# --- kotlin ------------------------------------------------------------------
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# --- networking --------------------------------------------------------------
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# --- test: shared ------------------------------------------------------------
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# --- test: :core (JUnit 5) ---------------------------------------------------
junit5-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit5-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit5-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# --- test: :app (JUnit 4 + Robolectric + Espresso) ---------------------------
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }
androidx-test-junit = { module = "androidx.test.ext:junit-ktx", version.ref = "androidxJunit" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[bundles]
app-unit-test = ["junit4", "robolectric", "truth", "androidx-test-core", "androidx-test-junit", "kotlinx-coroutines-test", "okhttp-mockwebserver", "turbine"]
app-android-test = ["androidx-test-espresso-core", "androidx-test-espresso-contrib", "androidx-test-junit", "androidx-test-rules", "androidx-test-runner", "truth"]
core-test = ["junit5-jupiter", "truth", "kotlinx-coroutines-test", "okhttp-mockwebserver", "turbine"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
